name: tv_remote
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  basic_utils: ^5.8.2
  bonsoir: ^7.1.6
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  pointycastle: ^4.0.0
  record: ^7.1.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "design/logo/png/app-icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1A2030"
  adaptive_icon_foreground: "design/logo/png/adaptive-foreground.png"
  adaptive_icon_monochrome: "design/logo/png/adaptive-monochrome.png"
